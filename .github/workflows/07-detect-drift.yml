name: Detect Infrastructure Drift

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform init
        run: cd terraform && terraform init

      - name: Terraform plan and detect drift
        id: drift
        run: |
          cd terraform
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          DRIFTED=$(jq -r '[.resource_changes[] | select(.change.actions != ["no-op"]) | .address] | join(", ")' plan.json)
          COUNT=$(jq '[.resource_changes[] | select(.change.actions != ["no-op"])] | length' plan.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "drifted=$DRIFTED" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi

      - name: Post drift alert to Slack
        if: steps.drift.outputs.drift == 'true'
        run: |
          MSG="Configuration drift detected: ${{ steps.drift.outputs.count }} resource(s) changed outside Terraform. Affected: ${{ steps.drift.outputs.drifted }}"
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"$MSG\"}" ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Post no-drift confirmation to Slack
        if: steps.drift.outputs.drift == 'false'
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Drift check passed: live infrastructure matches the Terraform definition. No drift detected."}' ${{ secrets.SLACK_WEBHOOK_URL }}