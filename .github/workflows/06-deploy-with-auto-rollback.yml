name: Deploy with Auto-Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy to user-service"
        required: true
        default: "latest"

jobs:
  deploy-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group koalatech-week08-rg --name koalatech-week08-aks --overwrite-existing

      - name: Capture current known-good image
        id: current
        run: |
          PREV=$(kubectl get deployment user-service -n staging -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "previous=$PREV" >> $GITHUB_OUTPUT
          echo "Known-good image is $PREV"

      - name: Deploy the new image
        run: |
          kubectl set image deployment/user-service user-service=koalatechweek08acrrish.azurecr.io/user-service:${{ github.event.inputs.image_tag }} -n staging

      - name: Monitor rollout health
        id: monitor
        run: |
          if kubectl rollout status deployment/user-service -n staging --timeout=90s; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "New release became healthy."
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "New release did not become healthy within 90 seconds."
          fi

      - name: Automatic rollback on failure
        if: steps.monitor.outputs.healthy == 'false'
        run: |
          echo "Rolling back to the previous image: ${{ steps.current.outputs.previous }}"
          kubectl set image deployment/user-service user-service=${{ steps.current.outputs.previous }} -n staging
          kubectl rollout status deployment/user-service -n staging --timeout=120s
          echo "Rollback complete. Service restored to ${{ steps.current.outputs.previous }}"

      - name: Mark run as failed when a rollback happened
        if: steps.monitor.outputs.healthy == 'false'
        run: |
          echo "Deployment was automatically rolled back because the new release was unhealthy."
          exit 1