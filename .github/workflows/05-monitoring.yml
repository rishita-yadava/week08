name: 05 - Deploy and Validate Monitoring

on:
  # Called by 04 - Deploy to Production after a successful deployment
  workflow_call:

  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

  monitoring:
    name: Deploy and Validate Prometheus and Grafana
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # The Grafana admin password comes from a GitHub secret and is stored
      # as a Kubernetes secret, so it never appears in the repository
      - name: Create monitoring namespace and Grafana admin secret
        env:
          GRAFANA_PW: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_PW" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --set grafana.admin.existingSecret=grafana-admin \
            --set grafana.admin.userKey=admin-user \
            --set grafana.admin.passwordKey=admin-password \
            --wait \
            --timeout 10m

      - name: Apply user-service ServiceMonitor
        run: |
          kubectl apply -f monitoring/user-service-servicemonitor.yaml

      - name: Wait for Prometheus and Grafana to be ready
        run: |
          for i in $(seq 1 30); do
            kubectl -n monitoring get statefulset prometheus-kube-prometheus-stack-prometheus && break
            echo "Waiting for Prometheus to be created..."
            sleep 10
          done
          kubectl -n monitoring rollout status statefulset/prometheus-kube-prometheus-stack-prometheus --timeout=300s
          kubectl -n monitoring rollout status deployment/kube-prometheus-stack-grafana --timeout=300s
          kubectl get pods -n monitoring

      - name: Validate Prometheus is scraping user-service metrics
        run: |
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090 > /dev/null 2>&1 &
          sleep 5

          for i in $(seq 1 18); do
            result=$(curl -s http://localhost:9090/api/v1/query --data-urlencode 'query=up{service="user-service"}')
            healthy=$(echo "$result" | jq '[.data.result[] | select(.value[1] == "1")] | length')

            if [ "$healthy" -ge 1 ]; then
              echo "Prometheus is successfully scraping $healthy user-service target(s):"
              echo "$result" | jq -r '.data.result[] | "  namespace=\(.metric.namespace)  pod=\(.metric.pod)  up=\(.value[1])"'
              exit 0
            fi

            echo "Attempt $i: user-service targets not up yet, retrying in 10s..."
            sleep 10
          done

          echo "Prometheus is not scraping user-service metrics"
          echo "$result"
          exit 1